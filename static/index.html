<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go × WebAssembly Gallery</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(ellipse at 50% 0%, #1c1440, #0b0920 70%);
    font-family: system-ui, sans-serif;
    color: #e8e5ff;
  }
  main { text-align: center; padding: 2rem; }
  h1 { font-weight: 600; letter-spacing: 0.02em; }
  .sub { color: #a89fd6; margin-top: -0.5rem; font-size: 0.9rem; }
  #controls { margin: 1.25rem 0; }
  .btn {
    background: #241a52;
    color: #cdc6ff;
    border: 1px solid #4b3a9e;
    border-radius: 8px;
    padding: 0.5rem 1.1rem;
    margin: 0 0.25rem;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn:hover { background: #34266f; }
  canvas {
    width: 640px;
    max-width: 92vw;
    aspect-ratio: 320 / 200;
    image-rendering: pixelated;
    border-radius: 10px;
    border: 1px solid #34266f;
    box-shadow: 0 12px 40px rgba(109, 74, 255, 0.25);
  }
</style>
</head>
<body>
<main>
  <h1>Go × WebAssembly Gallery</h1>
  <p class="sub">Server, renderer and UI written entirely in Go — no application JavaScript.</p>
  <div id="controls"></div>
  <canvas id="stage" width="320" height="200"></canvas>
</main>
<script type="module" src="load.js"></script>
</body>
</html>
